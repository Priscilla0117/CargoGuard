name: Verify application

on:
  push:
    branches: ["codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Authored operations challenge
        run: node --import tsx scripts/evaluate-operations-challenge.ts --report work/validation/operations-challenge/ci.json
      - name: Production build and local OCR assets
        run: npm run build
      - name: Authenticated team workflow and restart persistence
        run: node scripts/test-team-runtime.mjs
